[package]
name = "wagyu"
version = "0.6.3"
authors = [
    "Collin Chin",
    "Raymond Chu",
    "Ali Mousa",
    "Howard Wu"
]
description = "A command-line tool to generate cryptocurrency wallets"
homepage = "https://github.com/AleoHQ/wagyu"
repository = "https://github.com/AleoHQ/wagyu"
categories = ["command-line-utilities", "cryptocurrency"]
keywords = ["blockchain", "command-line", "crypto", "cryptocurrency", "wallet"]
readme = "README.md"
license = "MIT/Apache-2.0"
edition = "2018"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }

[lib]
path = "wagyu/lib.rs"

[[bin]]
name = "wagyu"
path = "wagyu/main.rs"

[workspace]
members = [ "bitcoin", "ethereum", "model", "monero", "tron" ]

[badges]
travis-ci = { repository = "AleoHQ/wagyu", branch = "master" }

[features]
default = ["std"]
std = ["wagyu-model/std", "wagyu-bitcoin/std", "wagyu-ethereum/std", "wagyu-model/std", "wagyu-monero/std"]

[dependencies]
wagyu-bitcoin = { path = "./bitcoin", version = "0.6.3" }
wagyu-ethereum = { path = "./ethereum", version = "0.6.3" }
wagyu-model = { path = "./model", version = "0.6.3" }
wagyu-monero = { path = "./monero", version = "0.6.3" }
wagyu-tron = { path = "./tron", version = "0.6.3" }

arrayvec = { version = "0.7" }
base58 = { version = "0.2" }
clap = { version = "2.34" }
colored = { version = "2.0" }
digest = { version = "0.10" }
either = { version = "1.13" }
thiserror = { version = "1.0" }
hex = { version = "0.4" }
lazy_static = { version = "1.5" }
rand = { version = "0.8" }
rand_core = { version = "0.6" }
safemem = { version = "0.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
tiny-keccak = { version = "2.0", features = ["keccak"] }

[profile.release]
opt-level = 3
lto = "thin"
incremental = true

[profile.bench]
opt-level = 3
debug = false
rpath = false
lto = "thin"
incremental = true
debug-assertions = false

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 3
incremental = true
debug-assertions = true
debug = true
