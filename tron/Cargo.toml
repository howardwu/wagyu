[package]
name = "wagyu-tron"
version = "0.6.3"
authors = [
    "Collin Chin",
    "Raymond Chu",
    "Ali Mousa",
    "Howard Wu"
]
description = "A library for generating Tron wallets"
homepage = "https://github.com/AleoHQ/wagyu"
repository = "https://github.com/AleoHQ/wagyu/tree/v0.6.3/tron"
categories = ["command-line-utilities", "cryptocurrency"]
keywords = ["blockchain", "crypto", "cryptocurrency", "tron", "wallet"]
readme = "README.md"
license = "MIT/Apache-2.0"
edition = "2018"

[dependencies]
wagyu-model = { path = "../model", version = "0.6.3" }

base58 = { version = "0.2" }
bitvec = { version = "1.0" }
digest = { version = "0.10", default-features = false }
ethereum-types = { version = "0.14", default-features = false, features = ["rlp", "serialize"] }
hex = { version = "0.4", default-features = false }
hmac = { version = "0.12" }
libsecp256k1 = { version = "0.7", default-features = false, features = ["hmac"] }
pbkdf2 = { version = "0.12", default-features = false }
rand = { version = "0.8", default-features = false }
rand_xorshift = { version = "0.3" }
regex = { version = "1.10" }
rlp = { version = "0.5", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
tiny-keccak = { version = "2.0", features = ["keccak"] }

[features]
default = ["std"]
std = ["wagyu-model/default"]

[badges]
travis-ci = { repository = "AleoHQ/wagyu", branch = "master" }
